apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-library'

// 代码源设置：将commonMain和jvmMain的源码合并到一起
sourceSets {
  main {
    kotlin {
      srcDirs += ['src/commonMain/kotlin', 'src/jvmMain/kotlin'] 
    }
  }
  test {
    kotlin {
      srcDirs += ['src/commonTest/kotlin', 'src/jvmTest/kotlin', 'src/commonTest/proto-kotlin', 'src/jvmTest/proto-kotlin']
    }
    java {
      srcDirs += ['src/jvmTest/proto-java']
    }
  }
  
  // 保留原来已有的两个特殊测试源集
  kotlinInteropTest {
    kotlin {
      srcDirs = ['src/jvmKotlinInteropTest/proto-kotlin']
    }
  }
  
  kotlinAndroidTest {
    kotlin {
      srcDirs = ['src/jvmKotlinAndroidTest/proto-kotlin']
    }
  }
}

// 只创建原来就有的两个特殊测试任务
tasks.register('jvmKotlinInteropTest', Test) {
  testClassesDirs = sourceSets.kotlinInteropTest.output.classesDirs
  classpath = sourceSets.kotlinInteropTest.runtimeClasspath + sourceSets.main.runtimeClasspath
}

tasks.register('jvmKotlinAndroidTest', Test) {
  testClassesDirs = sourceSets.kotlinAndroidTest.output.classesDirs
  classpath = sourceSets.kotlinAndroidTest.runtimeClasspath + sourceSets.main.runtimeClasspath
}

// 设置测试任务依赖关系
tasks.named("test") {
  dependsOn jvmKotlinInteropTest
  dependsOn jvmKotlinAndroidTest
}

compileKotlin {
  kotlinOptions {
    freeCompilerArgs += "-Xuse-experimental=kotlinx.coroutines.ExperimentalCoroutinesApi"
    freeCompilerArgs += "-Xexperimental=com.squareup.wire.WireGrpcExperimental"
    freeCompilerArgs += "-Xmulti-platform"
    freeCompilerArgs += "-Xopt-in=kotlin.Experimental"
  }
}

jar {
  manifest {
    attributes('Automatic-Module-Name': 'wire-tests')
  }
}

dependencies {
  // 主要依赖
  api deps.kotlin.stdlib.jdk8
  api project(':wire-runtime')
  
  // 测试依赖
  testImplementation project(':wire-test-utils')
  testImplementation deps.assertj
  testImplementation deps.kotlin.test.junit
  testImplementation deps.jimfs
  
  // kotlinInteropTest依赖
  kotlinInteropTestImplementation project(':wire-grpc-client')
  kotlinInteropTestImplementation deps.kotlin.test.junit
  kotlinInteropTestImplementation deps.assertj
  
  // kotlinAndroidTest依赖
  kotlinAndroidTestCompileOnly deps.android
  kotlinAndroidTestImplementation deps.kotlin.test.junit
  kotlinAndroidTestImplementation deps.assertj
}